# Runs `make test` on every pull request, and on main after a merge, and loads the QML.
# The engine and its tests are standard library only. The job installs the two tools some
# tests skip without, so they run here too: PyMuPDF for the tests that read PDFs, and
# glslangValidator (glslang-tools) for the shader compile check. The qml job loads Panel.qml
# and BarWidget.qml with PySide6 (make qml-check).
#
# 3.11 is the oldest Python the engine supports (tomllib); 3.x is the newest release.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      # The whole history and its tags, so tests/test_docs.py can read the commit the README pins.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: python -m pip install pymupdf
      - run: python --version
      # The key the book fingerprints are read with (tests/test_no_book_text.py): a pull request from a fork doesn't get it, and is checked by
      # book-text.yml instead.
      - run: make test
        env:
          SOLO_FINGERPRINT_KEY: ${{ secrets.SOLO_FINGERPRINT_KEY }}

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Qt's offscreen platform still loads EGL, OpenGL and xkbcommon.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      # Pinned to a release the check is known to pass on (6.11 and 6.12 both do); Qt 6.12 is the one that
      # needed qs.Commons imported under a name of its own.
      - run: python -m pip install "PySide6-Essentials==6.12.*"
      - run: make qml-check
